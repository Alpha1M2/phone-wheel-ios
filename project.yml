name: PhoneWheel
options:
  preGenCommand: bash verify-transport.sh
  bundleIdPrefix: io.phonewheel.personal
  deploymentTarget:
    iOS: '16.4'
targets:
  PhoneWheel:
    type: application
    platform: iOS
    sources:
      - path: AppDelegate.swift
      - path: WheelViewController.swift
      - path: PinnedWebSocket.swift
      - path: NativeBridge.js
      - path: index.html
      - path: Assets.xcassets
        optional: true
    info:
      path: Generated-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.phonewheel.personal.controller
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: F1 Race Controller
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSMotionUsageDescription: 使用手机倾斜控制电脑游戏方向盘。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你电脑上的 Phone Wheel，发送手柄输入并接收赛车遥测。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: '0.3.1'
        CURRENT_PROJECT_VERSION: '10'
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: CryptoKit.framework
    scheme:
      testTargets: []

