name: Build iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated WebKit layout test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps webkit
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify touch layout and render previews
        run: node ui-layout-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-ui-previews
          path: ui-preview/
          if-no-files-found: warn
          retention-days: 7
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project PhoneWheel.xcodeproj -scheme PhoneWheel \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package IPA for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneWheel.app package/Payload/
          cd package
          zip -qr ../PhoneWheel-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneWheel-unsigned
          path: PhoneWheel-unsigned.ipa
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
